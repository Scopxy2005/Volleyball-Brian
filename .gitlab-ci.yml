stages:
  - build
  - test

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - local-docker

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

cache:
  paths:
    - .nuget/packages/

build:
  stage: build
  script:
    - dotnet restore
    - dotnet build --no-restore --configuration Release

test:
  stage: test
  script:
    - dotnet test --configuration Release